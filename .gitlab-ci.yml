# GitLab CI for transaction_intelligence_app.
# Ported from .github/workflows/ci.yml (2026-08-28).
#
# Deliberately NOT a literal translation. The GitHub workflow ran `docker build`
# with heredoc Dockerfiles and hand-rolled a bridge network plus a postgres
# container, because a self-hosted Actions runner has host Docker access.
# The GitLab runner on LXC 207 uses the docker executor with privileged=false,
# so `docker build` inside a job would fail. GitLab's native `image:` +
# `services:` does the same work with no Docker-in-Docker at all -- the job runs
# IN the python image and postgres is a sibling container on the job network.

stages:
  - lint
  - test
  - deploy

default:
  # The runner is registered run_untagged:false, so every job must opt in.
  tags:
    - homelab
    - docker
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - cd backend
    - ruff check .
    - ruff format --check .

test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: txnuser
    POSTGRES_PASSWORD: txnpass
    POSTGRES_DB: txndb
    # Reachable by service alias on the job network.
    DATABASE_URL: postgresql://txnuser:txnpass@postgres:5432/txndb
    TEST_DATABASE_URL: postgresql://txnuser:txnpass@postgres:5432/txndb_test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpq-dev postgresql-client
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest pytest-asyncio
    # `services:` starts postgres in parallel with the job, so wait for it.
    - for i in $(seq 1 30); do pg_isready -h postgres -U txnuser -d txndb && break; sleep 1; done
    - psql "$DATABASE_URL" -c "CREATE DATABASE txndb_test;"
  script:
    - pytest -v

# ---------------------------------------------------------------------------
# Deploy
#
# This replaces .github/workflows/deploy.yml, which was DELETED in this commit
# because it was a ghost pipeline: it built three images, pushed them to GHCR,
# and wrote both compose files to /opt/myapp -- but /opt/myapp/deploy.sh runs
#   docker compose up -d --build --remove-orphans
# with the BASE compose only. The base file declares `build:` for api/worker/
# frontend, so compose rebuilt locally (myapp-api:latest) and the GHCR images
# it had just pushed were never consumed by anything. deploy.sh is, and has
# been, the real deploy path.
#
# The SSH key is command-restricted on apps-vm:
#   command="/opt/myapp/deploy.sh",no-agent-forwarding,no-port-forwarding,no-pty
# so this job cannot run anything else, and no command is passed below.
#
# MANUAL ON PURPOSE. /opt/myapp still has origin -> GitHub, and deploy.sh does
# `git pull --ff-only origin main`. Until that origin is repointed at GitLab,
# this job would deploy whatever GitHub has, not what GitLab just tested.
# Switch to automatic in the same change that repoints origin.
deploy:
  stage: deploy
  image: alpine:latest
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    - ssh -i "$DEPLOY_SSH_KEY" -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile=/dev/null "$DEPLOY_USER@$DEPLOY_HOST"
  environment:
    name: production
    url: https://txn.home.aleksanlab.me
