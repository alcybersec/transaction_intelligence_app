name: CI

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run ruff check and format
        run: |
          docker build -t txn-backend-lint -f - ./backend <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir ruff
          COPY . .
          DOCKERFILE
          docker run --rm txn-backend-lint sh -c "ruff check . && ruff format --check ."

  backend-test:
    name: Backend Tests
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run pytest
        run: |
          # Bridge network so the test container can reach postgres by hostname.
          NET="txn-ci-net-${GITHUB_RUN_ID}"
          PG_NAME="txn-ci-pg-${GITHUB_RUN_ID}"
          docker network create "$NET"
          docker run -d --name "$PG_NAME" --network "$NET" --network-alias postgres \
            -e POSTGRES_USER=txnuser -e POSTGRES_PASSWORD=txnpass -e POSTGRES_DB=txndb \
            postgres:16-alpine
          # Wait for postgres to accept connections.
          for i in $(seq 1 30); do
            if docker exec "$PG_NAME" pg_isready -U txnuser -d txndb >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$PG_NAME" psql -U txnuser -d txndb -c "CREATE DATABASE txndb_test;"
          # Build the test image.
          docker build -t txn-backend-test -f - ./backend <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential libpq-dev && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          RUN pip install --no-cache-dir pytest pytest-asyncio
          COPY . .
          DOCKERFILE
          # Run pytest connected to the bridged postgres.
          docker run --rm --network "$NET" \
            -e DATABASE_URL=postgresql://txnuser:txnpass@postgres:5432/txndb \
            -e TEST_DATABASE_URL=postgresql://txnuser:txnpass@postgres:5432/txndb_test \
            txn-backend-test pytest -v
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Clean up postgres container
        if: always()
        run: |
          docker rm -f "txn-ci-pg-${GITHUB_RUN_ID}" 2>/dev/null || true
          docker network rm "txn-ci-net-${GITHUB_RUN_ID}" 2>/dev/null || true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

  worker-lint:
    name: Worker Lint
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run ruff check and format
        run: |
          docker build -t txn-worker-lint -f - ./worker <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          RUN pip install --no-cache-dir ruff
          COPY . .
          DOCKERFILE
          docker run --rm txn-worker-lint sh -c "ruff check . && ruff format --check ."

  worker-test:
    name: Worker Tests
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run pytest
        run: |
          docker build -t txn-worker-test -f - ./worker <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          RUN apt-get update && apt-get install -y --no-install-recommends build-essential libpq-dev && rm -rf /var/lib/apt/lists/*
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          RUN pip install --no-cache-dir pytest pytest-asyncio
          COPY . .
          DOCKERFILE
          docker run --rm txn-worker-test pytest -v

  frontend-lint:
    name: Frontend Lint
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run ESLint
        run: |
          docker build -t txn-frontend-lint -f - ./frontend <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci || npm install
          COPY . .
          DOCKERFILE
          docker run --rm txn-frontend-lint npx eslint .

  frontend-test:
    name: Frontend Tests
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Run vitest
        run: |
          docker build -t txn-frontend-test -f - ./frontend <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci || npm install
          COPY . .
          DOCKERFILE
          docker run --rm txn-frontend-test npm test -- --run

  docker-build:
    name: Docker Build Test
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t txn-api ./backend

      - name: Build Worker image
        run: docker build -t txn-worker ./worker

      - name: Build Frontend image
        run: docker build -t txn-frontend ./frontend
